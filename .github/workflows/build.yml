name: TTL Build

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "TTL 配置文件（JSON）"
        required: false
        default: "ttl-config.json"

jobs:
  # Step 1: 主机准备
  step1-host-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 初始化进度文件
        run: |
          ./build/scripts/progress-tracker.sh build-progress.json init
      
      - name: 执行 Step 1
        run: |
          ./build/scripts/step1-host-prepare.sh /mnt/lfs ttl-config.json build-progress.json
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step1-host-prepare
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step1.json
            pitfall-report-step1.json

  # Step 2: 交叉工具链
  step2-cross-toolchain:
    runs-on: ubuntu-latest
    needs: step1-host-prepare
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 1 产物
        uses: actions/download-artifact@v4
        with:
          name: step1-host-prepare
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 2
        run: |
          ./build/scripts/step2-cross-toolchain.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step2-cross-toolchain
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step2.json
            pitfall-report-step2.json

  # Step 3: Chroot 工具
  step3-chroot-tools:
    runs-on: ubuntu-latest
    needs: step2-cross-toolchain
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 2 产物
        uses: actions/download-artifact@v4
        with:
          name: step2-cross-toolchain
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 3
        run: |
          ./build/scripts/step3-chroot-tools.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step3-chroot-tools
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step3.json
            pitfall-report-step3.json

  # Step 4: 基础系统
  step4-base-system:
    runs-on: ubuntu-latest
    needs: step3-chroot-tools
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 3 产物
        uses: actions/download-artifact@v4
        with:
          name: step3-chroot-tools
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 4
        run: |
          ./build/scripts/step4-base-system.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step4-base-system
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step4.json
            pitfall-report-step4.json

  # Step 5: 内核 + GRUB
  step5-kernel:
    runs-on: ubuntu-latest
    needs: step4-base-system
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 4 产物
        uses: actions/download-artifact@v4
        with:
          name: step4-base-system
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 5
        run: |
          ./build/scripts/step5-kernel.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step5-kernel
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step5.json
            pitfall-report-step5.json

  # Step 6: 桌面体验
  step6-desktop-experience:
    runs-on: ubuntu-latest
    needs: step5-kernel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 5 产物
        uses: actions/download-artifact@v4
        with:
          name: step5-kernel
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 6
        run: |
          ./build/scripts/step6-desktop-experience.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step6-desktop-experience
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step6.json
            pitfall-report-step6.json

  # Step 7: 用户软件 + Wine
  step7-user-apps:
    runs-on: ubuntu-latest
    needs: step6-desktop-experience
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 6 产物
        uses: actions/download-artifact@v4
        with:
          name: step6-desktop-experience
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 7
        run: |
          ./build/scripts/step7-user-apps.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step7-user-apps
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step7.json
            pitfall-report-step7.json

  # Step 8: AI 助手
  step8-ai-assistant:
    runs-on: ubuntu-latest
    needs: step7-user-apps
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 7 产物
        uses: actions/download-artifact@v4
        with:
          name: step7-user-apps
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 8
        run: |
          ./build/scripts/step8-ai-assistant.sh /mnt/lfs ttl-config.json build-progress.json versions.lock
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: step8-ai-assistant
          path: |
            /mnt/lfs
            build-progress.json
            decision-log-step8.json
            pitfall-report-step8.json

  # Step 9: 打包 ISO
  step9-package-iso:
    runs-on: ubuntu-latest
    needs: step8-ai-assistant
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: 下载配置文件
        run: |
          if [ -n "${{ github.event.inputs.config_file }}" ]; then
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/${{ github.event.inputs.config_file }}"
          else
            curl -o ttl-config.json "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref }}/examples/ttl-config.example.json"
          fi
      
      - name: 下载 Step 8 产物
        uses: actions/download-artifact@v4
        with:
          name: step8-ai-assistant
          path: /mnt/lfs
      
      - name: 恢复进度文件
        run: |
          cp /mnt/lfs/build-progress.json .
      
      - name: 执行 Step 9
        run: |
          ./build/scripts/step9-package-iso.sh /mnt/lfs ttl-config.json build-progress.json versions.lock /output
      
      - name: 上传 ISO
        uses: actions/upload-artifact@v4
        with:
          name: ttl-iso
          path: /output/*.iso
      
      - name: 上传进度文件
        uses: actions/upload-artifact@v4
        with:
          name: build-progress
          path: build-progress.json
      
      - name: 上传到 Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: /output/*.iso
          body: |
            ## TTL 个性化桌面 Linux 发行版
            
            构建完成！请下载 ISO 文件。
            
            ### 体验版
            - `ttl-trial.iso`：用于体验，不安装到磁盘
            
            ### 无人值守安装版
            - `ttl-unattended.iso`：自动安装到磁盘
