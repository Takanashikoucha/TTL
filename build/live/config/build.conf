# live-build 构建配置
# 用于打包 TTL ISO

# 发行版名称
live.name="ttl"
live.version="1.0.0"
live.arch="amd64"

# 构建类型
live.bootloaders.grub.inst=y
live.image.iso.force=y

# 默认配置
live.config.chroot_packages="systemd systemd-sysv linux-image-amd64"

# 无人值守安装配置
live.config.preseed="preseed.cfg"

# 构建脚本
live.config.chroot_scripts="chroot.sh"

# 输出目录
live.image.outputdir="/output"
