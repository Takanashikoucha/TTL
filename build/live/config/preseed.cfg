# 无人值守安装 preseed 配置
# 根据 ttl-config.json 生成

# 分区配置
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe string atomic

# 确认分区
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# 时区
d-i time/zone string Asia/Shanghai

# 键盘布局
d-i keyboard-configuration/xkb-keymap us

# 控制台字符集
d-i console-setup/charmap string UTF-8
d-i console-setup/confirm boolean true

# 用户配置
d-i base-passwd/password string user
d-i passwd/user-fullname string user
d-i passwd/username string user
d-i passwd/user-password password user
d-i passwd/user-password-again password user
d-i passwd/user-uid string 1000

# 软件包
d-i pkgsel/extra-packages string firefox thunderbird vlc obs-studio git vim python3 nodejs

# 完成安装
d-i finish-install/reboot now
